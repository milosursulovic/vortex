# Example VORTEX configuration showing every supported field.
# Copy to vortex.yaml and adjust for your environment.
# ${VAR} references are expanded from environment variables at load time.

server:
  workers: 8
  shutdown_timeout: 30s

admin:
  address: ":9090"

logging:
  level: info
  format: json

listeners:
  - name: http
    address: ":8080"
    protocol: http

  # TLS termination: only supported on http listeners — VORTEX decrypts,
  # then proxies plain HTTP to the backend. TCP listeners always pass raw
  # bytes through undecrypted (TLS passthrough needs no extra config).
  - name: https
    address: ":8443"
    protocol: http
    tls:
      enabled: true
      certificate: certs/server.crt
      key: certs/server.key
      # Optional: serve a different certificate per SNI hostname, falling
      # back to certificate/key above for anything else.
      sni:
        - host: app.example.com
          certificate: certs/app.example.com.crt
          key: certs/app.example.com.key

  - name: tcp
    address: ":9000"
    protocol: tcp

# Flat pool used by TCP listeners.
backends:
  - name: app-1
    address: "10.0.0.11:8080"
    weight: 1

  - name: app-2
    address: "10.0.0.12:8080"
    weight: 2

# Named pools used by HTTP listeners, selected per-request via routes below.
backend_pools:
  - name: api
    backends:
      - name: api-1
        address: "10.0.0.21:8080"
        weight: 1

  - name: frontend
    backends:
      - name: web-1
        address: "10.0.0.31:8080"
        weight: 1

# Host (exact match; "" or "*" = any host) + path (longest prefix wins).
routes:
  - host: api.example.com
    path: /api
    backend_pool: api

  - host: ""
    path: /
    backend_pool: frontend

load_balancing:
  algorithm: weighted_round_robin

health_check:
  enabled: true
  type: tcp # tcp (connect only) or http (GET path below)
  path: /health
  interval: 5s
  timeout: 2s
  unhealthy_threshold: 3
  healthy_threshold: 2

timeouts:
  connect: 5s
  read: 30s
  write: 30s
  idle: 60s
