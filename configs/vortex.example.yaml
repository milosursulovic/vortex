# Example VORTEX configuration showing every supported field.
# Copy to vortex.yaml and adjust for your environment.
# ${VAR} references are expanded from environment variables at load time.

server:
  workers: 8
  shutdown_timeout: 30s

admin:
  address: ":9090"

logging:
  level: info
  format: json

listeners:
  - name: http
    address: ":8080"
    protocol: http

  # TLS termination: only supported on http listeners — VORTEX decrypts,
  # then proxies plain HTTP to the backend. TCP listeners always pass raw
  # bytes through undecrypted (TLS passthrough needs no extra config).
  - name: https
    address: ":8443"
    protocol: http
    tls:
      enabled: true
      certificate: certs/server.crt
      key: certs/server.key
      # Optional: serve a different certificate per SNI hostname, falling
      # back to certificate/key above for anything else.
      sni:
        - host: app.example.com
          certificate: certs/app.example.com.crt
          key: certs/app.example.com.key

  - name: tcp
    address: ":9000"
    protocol: tcp

# Flat pool used by TCP listeners.
backends:
  - name: app-1
    address: "10.0.0.11:8080"
    weight: 1

  - name: app-2
    address: "10.0.0.12:8080"
    weight: 2

# Named pools used by HTTP listeners, selected per-request via routes below.
backend_pools:
  - name: api
    backends:
      - name: api-1
        address: "10.0.0.21:8080"
        weight: 1

  - name: frontend
    backends:
      - name: web-1
        address: "10.0.0.31:8080"
        weight: 1

# Host (exact match; "" or "*" = any host) + path (longest prefix wins).
routes:
  - host: api.example.com
    path: /api
    backend_pool: api

  - host: ""
    path: /
    backend_pool: frontend

load_balancing:
  algorithm: weighted_round_robin

health_check:
  enabled: true
  type: tcp # tcp (connect only) or http (GET path below)
  path: /health
  interval: 5s
  timeout: 2s
  unhealthy_threshold: 3
  healthy_threshold: 2

timeouts:
  connect: 5s
  read: 30s
  write: 30s
  idle: 60s

# Resource caps. 0 means unlimited for any field here — these are opt-in.
limits:
  max_connections: 100000
  max_connections_per_backend: 10000
  max_request_body_mb: 10
  max_header_size_kb: 64

# HTTP-only. Token bucket, checked globally then (if enabled) per client IP.
rate_limit:
  enabled: false
  requests_per_second: 1000
  burst: 2000
  per_ip: true
  per_ip_requests_per_second: 100
  per_ip_burst: 200

# Per-backend: stop sending traffic to a backend after consecutive
# connection failures, retry it after open_timeout via one trial request.
circuit_breaker:
  enabled: true
  failure_threshold: 5
  open_timeout: 30s

# HTTP-only. Only GET/HEAD/OPTIONS are ever retried, regardless of config.
retry:
  enabled: false
  max_retries: 2
  retry_on: [connection_failure, timeout]

# Prometheus metrics are always exposed at GET /metrics on the admin
# server (see admin.address above) — no config needed to enable them.

# Optional distributed tracing for HTTP requests. Disabled by default.
tracing:
  enabled: false
  exporter: stdout # "stdout" or "otlp-http"
  endpoint: "localhost:4318" # only used by otlp-http
  sample_ratio: 1.0
  service_name: vortex

# Debug surfaces on the (already private) admin server.
debug:
  pprof_enabled: false # exposes GET /debug/pprof/* — has real overhead, opt in
