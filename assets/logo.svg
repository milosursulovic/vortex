<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="VORTEX logo">
  <defs>
    <linearGradient id="vortexRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="vortexCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
  </defs>

  <!-- rotating distribution ring, open with an arrowhead to suggest motion -->
  <path d="M 100 24
           A 76 76 0 1 1 33.5 141.5"
        fill="none" stroke="url(#vortexRing)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 33.5 141.5 L 20 128 L 47 122 Z" fill="#22D3EE"/>

  <!-- spokes from core to each backend node -->
  <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="100" y1="100" x2="100" y2="46"/>
    <line x1="100" y1="100" x2="145" y2="127"/>
    <line x1="100" y1="100" x2="55" y2="127"/>
  </g>

  <!-- three backend nodes -->
  <circle cx="100" cy="46" r="15" fill="url(#vortexRing)"/>
  <circle cx="145" cy="127" r="15" fill="url(#vortexRing)"/>
  <circle cx="55" cy="127" r="15" fill="url(#vortexRing)"/>

  <!-- load balancer core -->
  <circle cx="100" cy="100" r="22" fill="url(#vortexCore)"/>
</svg>
